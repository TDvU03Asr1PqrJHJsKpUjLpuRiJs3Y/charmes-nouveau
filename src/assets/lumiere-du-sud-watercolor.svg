      <path d="M105 553c112-96 244-143 394-142 119 0 215 36 312 100 96 62 209 92 339 87l-9 223c-154 39-307 17-459-66-118-65-233-79-346-45-78 23-159 58-243 105Z" fill="url(#lavenderWash)" opacity=".92"/>
      <path d="M-17 476c122-43 244-48 365-16 114 30 215 91 331 92 157 3 320-87 493-102l25 220c-140 32-274 45-403 39-155-8-287-77-440-111-114-25-236-15-367 30Z" fill="url(#oliveWash)" opacity=".72"/>
      <path d="M513 78c119-17 238 0 359 53 54 77 60 161 17 251-102 17-205 7-311-30-51-91-73-182-65-274Z" fill="#ffe1a8" opacity=".49"/>
      <path d="M132 169c99-33 200-28 302 17 36 58 37 119 4 184-94 24-187 20-279-13-44-58-53-121-27-188Z" fill="#f9c69f" opacity=".42"/>
      <path d="M825 344c106-30 217-26 333 10 42 72 45 147 10 225-129 7-246-17-350-72-17-55-15-109 7-163Z" fill="#d6b0b6" opacity=".36"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M79 528c135-26 272-22 411 12 183 44 376 35 580-29" stroke="#74668d" stroke-width="3" opacity=".28"/>
      <path d="M104 641c161-52 321-51 480 2 139 47 295 37 467-29" stroke="#8c9260" stroke-width="4" opacity=".3"/>
      <path d="M177 418c71-76 155-124 253-143" stroke="#c77964" stroke-width="3" opacity=".25"/>
      <path d="M703 173c64 66 98 145 104 238" stroke="#a47b61" stroke-width="3" opacity=".25"/>
      <path d="M936 413c62 43 103 94 124 153" stroke="#74668d" stroke-width="3" opacity=".23"/>
    </g>
    <g opacity=".26">
      <path d="M312 752c21-31 42-31 62 0-20 29-41 29-62 0Z" fill="#7e9062"/>
      <path d="M692 698c27-38 55-39 84-3-26 37-54 38-84 3Z" fill="#8e79a4"/>
      <path d="M902 237c28-35 56-35 84 1-28 35-56 35-84-1Z" fill="#d98b6c"/>
