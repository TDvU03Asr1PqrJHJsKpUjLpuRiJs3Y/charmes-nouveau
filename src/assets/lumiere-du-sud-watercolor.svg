<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Lumiere du Sud watercolor abstraction</title>
  <desc id="desc">An original abstract watercolor vector inspired by southern French sunlight, pale stone, lavender shade, and warm salon air.</desc>
  <defs>
    <linearGradient id="southernSky" x1="16%" y1="2%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="45%" stop-color="#f6dac1"/>
      <stop offset="100%" stop-color="#d8c5ba"/>
    </linearGradient>
    <radialGradient id="sunBloom" cx="72%" cy="19%" r="43%">
      <stop offset="0%" stop-color="#ffe7a5" stop-opacity=".9"/>
      <stop offset="36%" stop-color="#f7b680" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#f7b680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lavenderWash" x1="7%" y1="74%" x2="92%" y2="29%">
      <stop offset="0%" stop-color="#82719b" stop-opacity=".48"/>
      <stop offset="44%" stop-color="#b6a3bb" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ffe0b6" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="oliveWash" x1="0%" y1="49%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#9fa76a" stop-opacity=".43"/>
      <stop offset="58%" stop-color="#c7b06f" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#e58f73" stop-opacity=".2"/>
    </linearGradient>
    <filter id="bleed" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .035" numOctaves="4" seed="29" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="20" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55 .75" numOctaves="3" seed="11" result="fiberNoise"/>
      <feColorMatrix in="fiberNoise" type="matrix" values="0 0 0 0 .62 0 0 0 0 .55 0 0 0 0 .47 0 0 0 .11 0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#southernSky)"/>
  <rect width="1200" height="900" fill="url(#sunBloom)"/>
  <g filter="url(#fiber)">
    <path d="M0 337c127-56 253-76 378-61 153 19 278 87 427 72 146-16 260-88 395-74v626H0Z" fill="#f3dfc3" opacity=".58"/>
