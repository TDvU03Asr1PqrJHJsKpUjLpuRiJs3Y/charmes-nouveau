<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Noir Blue Signal abstract hair light</title>
  <desc id="desc">Near-black salon concept art with blue signal lines and hair-like flowing forms.</desc>
  <defs>
    <linearGradient id="blue-sweep" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4ba3ff" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#8b5cf6" stop-opacity=".74"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="white-cut" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".32" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="#050507"/>
  <path d="M0 340h1600M0 585h1600M0 830h1600" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <path d="M260 0v1100M720 0v1100M1180 0v1100" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
  <path d="M-100 760C250 400 510 320 780 420c220 82 320 250 560 150 120-50 215-150 360-190"
        fill="none" stroke="url(#blue-sweep)" stroke-width="74" stroke-linecap="round"/>
  <path d="M-60 820C300 520 510 500 850 590c260 68 430 0 790-260"
        fill="none" stroke="#4ba3ff" stroke-opacity=".58" stroke-width="18" stroke-linecap="round"/>
  <path d="M-40 910C330 690 600 720 900 760c295 40 520-110 760-330"
        fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 210h780" stroke="url(#white-cut)" stroke-width="28" stroke-linecap="round"/>
  <path d="M120 290h1160" stroke="#ffffff" stroke-opacity=".16" stroke-width="14" stroke-linecap="round"/>
  <path d="M120 350h990" stroke="#ffffff" stroke-opacity=".12" stroke-width="14" stroke-linecap="round"/>
  <rect x="1080" y="160" width="310" height="310" fill="none" stroke="#4ba3ff" stroke-opacity=".85" stroke-width="3"/>
  <rect x="1110" y="190" width="250" height="250" fill="#4ba3ff" fill-opacity=".08"/>
  <path d="M1160 365l52-104 68 64 52-118" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="8"/>
  <text x="116" y="1015" fill="#ffffff" fill-opacity=".92" font-family="Inter, sans-serif" font-size="64" font-weight="900">NOIR BLUE SIGNAL</text>
  <text x="120" y="1062" fill="#4ba3ff" font-family="Inter, sans-serif" font-size="24" font-weight="900" letter-spacing="8">HIGASHI-KOGANEI / CHARMES NOUVEAU</text>
