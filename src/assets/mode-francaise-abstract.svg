<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Mode francaise abstract watercolor</title>
  <desc id="desc">An original abstract watercolor vector suggesting French fashion through ink gestures, satin neutrals, rouge accents, and editorial negative space.</desc>
  <defs>
    <linearGradient id="studioPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f1ea"/>
      <stop offset="50%" stop-color="#ece2dc"/>
      <stop offset="100%" stop-color="#cfd0d0"/>
    </linearGradient>
    <linearGradient id="satinColumn" x1="39%" y1="8%" x2="70%" y2="91%">
      <stop offset="0%" stop-color="#f6d8d2" stop-opacity=".68"/>
      <stop offset="50%" stop-color="#9aa0aa" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#242a33" stop-opacity=".34"/>
    </linearGradient>
    <radialGradient id="rougeBloom" cx="36%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#cc5962" stop-opacity=".72"/>
      <stop offset="55%" stop-color="#b34b55" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#b34b55" stop-opacity="0"/>
    </radialGradient>
    <filter id="fashionBleed" x="-16%" y="-16%" width="132%" height="132%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .026" numOctaves="5" seed="41" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.05"/>
    </filter>
    <filter id="inkSoftness" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation=".35"/>
    </filter>
    <filter id="paperTexture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="2" seed="5" result="texture"/>
      <feColorMatrix in="texture" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .07"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#studioPaper)"/>
  <rect width="1200" height="900" fill="url(#rougeBloom)"/>
  <g filter="url(#paperTexture)">
    <g filter="url(#fashionBleed)">
      <path d="M517 74c106 84 173 194 202 332 25 122 10 246-45 372-74 55-151 67-231 35 66-139 84-271 52-396-29-113-88-204-175-272 62-54 127-78 197-71Z" fill="url(#satinColumn)" opacity=".86"/>
      <path d="M168 498c76-93 173-140 291-141 89 0 178 31 267 94 88 63 186 85 293 66l80 210c-145 71-294 77-447 19-111-42-218-41-320 2-67 29-135 43-204 42Z" fill="#dad1c9" opacity=".64"/>
      <path d="M688 133c101-18 211 2 330 58 23 79 3 151-60 216-99 10-192-11-280-63-38-68-35-139 10-211Z" fill="#a9b1b9" opacity=".32"/>
      <path d="M236 195c77-35 160-41 250-17 33 52 30 106-8 163-82 28-166 27-251-4-29-49-26-96 9-142Z" fill="#e9b8b2" opacity=".48"/>
      <path d="M357 627c74-72 167-95 281-69 41 57 41 117-2 181-113 19-210-8-291-81Z" fill="#b64e58" opacity=".19"/>
    </g>
    <g fill="none" stroke="#252936" stroke-linecap="round" stroke-linejoin="round" filter="url(#inkSoftness)">
      <path d="M428 113c83 103 136 219 159 348 21 118 7 233-43 345" stroke-width="5" opacity=".5"/>
      <path d="M585 94c-60 106-83 218-68 337 15 119 63 226 144 321" stroke-width="3" opacity=".32"/>
      <path d="M320 267c100-36 204-36 314 1" stroke-width="4" opacity=".34"/>
      <path d="M246 548c148 90 311 122 490 96 88-13 172-42 253-86" stroke-width="4" opacity=".34"/>
      <path d="M783 188c76 41 129 100 158 177" stroke-width="3" opacity=".27"/>
      <path d="M191 715c125-49 254-51 386-5" stroke-width="3" opacity=".24"/>
    </g>
    <g fill="none" stroke="#b34854" stroke-linecap="round" opacity=".46">
      <path d="M313 369c53 32 109 45 168 40" stroke-width="4"/>
      <path d="M681 705c69-21 136-54 200-98" stroke-width="3"/>
      <path d="M766 458c68 23 133 24 196 4" stroke-width="3"/>
    </g>
    <g opacity=".31">
      <circle cx="393" cy="355" r="7" fill="#bc4652"/>
      <circle cx="515" cy="537" r="5" fill="#252936"/>
      <circle cx="754" cy="248" r="6" fill="#bc4652"/>
      <circle cx="880" cy="620" r="5" fill="#252936"/>
      <circle cx="278" cy="696" r="5" fill="#bc4652"/>
    </g>
  </g>
</svg>
