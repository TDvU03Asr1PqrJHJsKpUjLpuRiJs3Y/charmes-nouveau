<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Paris atelier watercolor abstraction</title>
  <desc id="desc">An original abstract watercolor vector evoking a quiet Paris atelier with blush washes, ink lines, and soft architectural light.</desc>
  <defs>
    <radialGradient id="paperGlow" cx="49%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#fff7f1"/>
      <stop offset="47%" stop-color="#f5e9dd"/>
      <stop offset="100%" stop-color="#d7c8b9"/>
    </radialGradient>
    <linearGradient id="windowWash" x1="18%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f7c8b8" stop-opacity=".86"/>
      <stop offset="42%" stop-color="#d9a5a0" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#727b88" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="tableWash" x1="0%" y1="68%" x2="100%" y2="84%">
      <stop offset="0%" stop-color="#a37e72" stop-opacity=".16"/>
      <stop offset="56%" stop-color="#6f5562" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#28384c" stop-opacity=".2"/>
    </linearGradient>
    <filter id="waterBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency=".013 .028" numOctaves="4" seed="17" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.35"/>
    </filter>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <clipPath id="softFrame">
      <rect x="68" y="54" width="1064" height="792" rx="18"/>
    </clipPath>
  </defs>
  <rect width="1200" height="900" fill="url(#paperGlow)"/>
